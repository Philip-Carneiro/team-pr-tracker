<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" />
  <!-- Git pull request icon (simplified) -->
  <!-- Source branch dot -->
  <circle cx="44" cy="38" r="7" fill="none" stroke="white" stroke-width="3"/>
  <!-- Source line down -->
  <line x1="44" y1="45" x2="44" y2="70" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Target branch dot -->
  <circle cx="84" cy="90" r="7" fill="none" stroke="white" stroke-width="3"/>
  <!-- Target line up -->
  <line x1="84" y1="83" x2="84" y2="58" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Merge arrow curve -->
  <path d="M44 70 Q44 90 64 90 L77 90" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Team dots (people) -->
  <circle cx="84" cy="38" r="5" fill="white" opacity="0.9"/>
  <circle cx="96" cy="48" r="4" fill="white" opacity="0.7"/>
  <circle cx="72" cy="48" r="4" fill="white" opacity="0.7"/>
</svg>
